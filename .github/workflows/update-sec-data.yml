name: Update SEC Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Initialize SEC database
        run: python -m src.database.seed
      - name: Ingest 13F filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "$(sqlite3 database/tracker.db 'SELECT COUNT(*) FROM filings_13f;')" -eq 0 ]; then
            python -m src.sec.ingest_13f --all
          else
            python -m src.sec.ingest_13f
          fi
      - name: Validate Python
        run: python -m compileall -q src
      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f database/tracker.db
          git diff --cached --quiet || git commit -m "Update SEC 13F data"
          git push
