name: Update SEC Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"

permissions:
  contents: write

concurrency:
  group: sec-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore SEC database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p database
          if gh release view sec-database --json assets --jq '.assets[] | select(.name == "tracker.db") | .name' | grep -qx "tracker.db"; then
            gh release download sec-database --pattern tracker.db --dir database --clobber
            echo "Restored persistent SEC database from GitHub Release."
          elif gh release view sec-database --json assets --jq '.assets[] | select(.name == "tracker.db.pending") | .name' | grep -qx "tracker.db.pending"; then
            gh release download sec-database --pattern tracker.db.pending --dir database --clobber
            mv database/tracker.db.pending database/tracker.db
            echo "Restored pending SEC database from GitHub Release."
          else
            recovery_asset="$(gh release view sec-database --json assets --jq '.assets[] | select(.name | startswith("tracker.db.")) | [.createdAt, .name] | @tsv' | sort | tail -n 1 | cut -f2)"
            if [ -n "$recovery_asset" ]; then
              gh release download sec-database --pattern "$recovery_asset" --dir database --clobber
              mv "database/$recovery_asset" database/tracker.db
              echo "Restored latest temporary SEC database from GitHub Release."
            else
              echo "No persistent SEC database found; this run will perform a full historical ingestion."
            fi
          fi

      - name: Initialize SEC database
        run: python -m src.database.seed

      - name: Ingest 13F filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "$(sqlite3 database/tracker.db 'SELECT COUNT(*) FROM filings_13f;')" -eq 0 ]; then
            python -m src.sec.ingest_13f --all
          else
            python -m src.sec.ingest_13f
          fi

      - name: Validate database
        run: |
          test -s database/tracker.db
          test "$(sqlite3 database/tracker.db 'PRAGMA integrity_check;')" = "ok"
          filings="$(sqlite3 database/tracker.db 'SELECT COUNT(*) FROM filings_13f;')"
          holdings="$(sqlite3 database/tracker.db 'SELECT COUNT(*) FROM holdings_13f;')"
          test "$filings" -gt 0
          test "$holdings" -gt 0
          echo "Database integrity check passed: $filings filings, $holdings holdings."

      - name: Validate Python
        run: python -m compileall -q src

      - name: Persist SEC database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload a pending copy first. If the final replacement fails,
          # the pending copy remains available for the next run.
          cp database/tracker.db tracker.db.pending
          gh release upload sec-database tracker.db.pending --clobber

          if gh release view sec-database --json assets --jq '.assets[] | select(.name == "tracker.db") | .name' | grep -qx "tracker.db"; then
            gh release delete-asset sec-database tracker.db --yes
          fi

          gh release upload sec-database database/tracker.db

          assets="$(gh release view sec-database --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            case "$asset" in
              tracker.db.pending|tracker.db.*)
                gh release delete-asset sec-database "$asset" --yes
                ;;
            esac
          done <<< "$assets"

          rm -f tracker.db.pending
          echo "Persistent SEC database updated successfully."
